<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You, Always</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfbfa;
            --card-bg: #ffffff;
            --text-main: #2c2a29;
            --text-muted: #6b6563;
            --accent: #b85d4f;
            --border: #f0eae6;
            --danger-bg: #fdf2f1;
            --danger-text: #a94442;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.7;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .entry-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(44, 42, 41, 0.03);
            position: relative;
        }

        .entry-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .entry-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--text-main);
        }

        .entry-content {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            white-space: pre-line;
            color: #3a3735;
        }

        .admin-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px dashed var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .upload-panel {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(44, 42, 41, 0.03);
            text-align: left;
        }

        .upload-panel h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            background: var(--bg-color);
            color: var(--text-main);
        }

        textarea.form-control {
            resize: vertical;
            height: 150px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-btn {
            background: var(--text-main);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--accent);
        }

        .delete-btn {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid #f5c6cb;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background: #f8d7da;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>For You, Always</h1>
            <p>A collection of letters and poems, written with love for you bunny butt.</p>
        </header>

        <div class="admin-section">
            <button class="btn" onclick="toggleUploadPanel()">Admin Mode</button>
        </div>

        <div id="uploadPanel" class="upload-panel">
            <h3 id="panelHeading">Admin Login</h3>
            <div id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="usernameInput" class="form-control" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="passwordInput" class="form-control" placeholder="Enter password">
                </div>
                <button class="submit-btn" onclick="verifyLogin()">Authenticate</button>
            </div>

            <div id="entryForm" style="display: none;">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="entryTitle" class="form-control" placeholder="Poem or Letter Title">
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <textarea id="entryContent" class="form-control" placeholder="Write your words here..."></textarea>
                </div>
                <button class="submit-btn" onclick="saveEntryToGitHub()">Publish Permanently</button>
            </div>
        </div>

        <main id="entriesContainer">
            <!-- Loaded dynamically from poems.json -->
        </main>

        <footer>
            Built with all my love so you can always come back to re-read or see if i upload new letters or poems for you beautiful ❤️
        </footer>
    </div>

    <script>
        const REPO_OWNER = "Sogicek";
        const REPO_NAME = "letters";
        const FILE_PATH = "poems.json";
        const HARDCODED_TOKEN = "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";
        
        let currentEntries = [];
        let isAdminLoggedIn = false;

        document.addEventListener('DOMContentLoaded', () => {
            loadPoemsFromDatabase();
        });

        function toggleUploadPanel() {
            const panel = document.getElementById('uploadPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function verifyLogin() {
            const user = document.getElementById('usernameInput').value;
            const pass = document.getElementById('passwordInput').value;

            if (user === 'Sogicek' && pass === '@Qxh3zbny1') {
                isAdminLoggedIn = true;
                document.getElementById('panelHeading').innerText = 'Publish New Poem or Letter';
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('entryForm').style.display = 'block';
                displayEntries();
            } else {
                alert('Incorrect username or password.');
            }
        }

        async function loadPoemsFromDatabase() {
            try {
                const response = await fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}?t=${new Date().getTime()}`);
                if (response.ok) {
                    currentEntries = await response.json();
                } else {
                    currentEntries = [];
                }
            } catch (err) {
                currentEntries = [];
            }
            displayEntries();
        }

        async function saveEntryToGitHub() {
            const title = document.getElementById('entryTitle').value.trim();
            const content = document.getElementById('entryContent').value.trim();

            if (!title || !content) {
                alert('Please fill out both the title and content.');
                return;
            }

            const now = new Date();
            const options = { month: 'long', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            const timestamp = now.toLocaleDateString('en-US', options);

            const newEntry = {
                title: title,
                content: content,
                date: timestamp
            };

            currentEntries.unshift(newEntry);

            await updateGitHubFile(`Add poem: ${title}`);
        }

        async function deleteEntry(index) {
            if (confirm('Are you sure you want to delete this poem or letter permanently?')) {
                const removed = currentEntries.splice(index, 1);
                await updateGitHubFile(`Delete poem: ${removed[0].title}`);
            }
        }

        async function updateGitHubFile(commitMessage) {
            const apiUri = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

            try {
                const getRes = await fetch(apiUri, {
                    headers: { "Authorization": `token ${HARDCODED_TOKEN}` }
                });
                const fileData = await getRes.json();
                const fileSha = fileData.sha;

                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(currentEntries, null, 2))));

                const putRes = await fetch(apiUri, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${HARDCODED_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: commitMessage,
                        content: updatedContent,
                        sha: fileSha
                    })
                });

                if (putRes.ok) {
                    alert('Successfully published permanently to GitHub!');
                    document.getElementById('entryTitle').value = '';
                    document.getElementById('entryContent').value = '';
                    document.getElementById('uploadPanel').style.display = 'none';
                    
                    setTimeout(loadPoemsFromDatabase, 3000);
                } else {
                    alert('Failed to update GitHub database.');
                }
            } catch (err) {
                alert('An error occurred during sync.');
            }
        }

        function displayEntries() {
            const container = document.getElementById('entriesContainer');
            
            if (currentEntries.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted);">No entries found yet.</p>`;
                return;
            }

            let html = '';
            currentEntries.forEach((entry, index) => {
                html += `
                    <article class="entry-card">
                        <div class="entry-meta">
                            <span>Poem / Letter</span>
                            <span>${entry.date}</span>
                        </div>
                        <h2 class="entry-title">${escapeHtml(entry.title)}</h2>
                        <div class="entry-content">${escapeHtml(entry.content)}</div>
                        ${isAdminLoggedIn ? `<button class="delete-btn" onclick="deleteEntry(${index})">Delete Entry</button>` : ''}
                    </article>
                `;
            });
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
