<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You, Always</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfbfa;
            --card-bg: #ffffff;
            --text-main: #2c2a29;
            --text-muted: #6b6563;
            --accent: #b85d4f;
            --border: #f0eae6;
            --danger-bg: #fdf2f1;
            --danger-text: #a94442;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.7;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .entry-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(44, 42, 41, 0.03);
            position: relative;
        }

        .entry-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .entry-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--text-main);
        }

        .entry-content {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            white-space: pre-line;
            color: #3a3735;
        }

        /* Admin / Upload Section Styles */
        .admin-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px dashed var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .upload-panel {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(44, 42, 41, 0.03);
            text-align: left;
        }

        .upload-panel h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            background: var(--bg-color);
            color: var(--text-main);
        }

        textarea.form-control {
            resize: vertical;
            height: 150px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-btn {
            background: var(--text-main);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--accent);
        }

        .delete-btn {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid #f5c6cb;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background: #f8d7da;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>For You, Always</h1>
            <p>A collection of letters and poems, written with love for you bunny butt.</p>
        </header>

        <!-- Admin Mode Toggle Button -->
        <div class="admin-section">
            <button class="btn" onclick="toggleUploadPanel()">Admin Mode</button>
        </div>

        <!-- Secure Upload Panel -->
        <div id="uploadPanel" class="upload-panel">
            <h3 id="panelHeading">Admin Login</h3>
            <div id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="usernameInput" class="form-control" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="passwordInput" class="form-control" placeholder="Enter password">
                </div>
                <button class="submit-btn" onclick="verifyLogin()">Authenticate</button>
            </div>

            <div id="entryForm" style="display: none;">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="entryTitle" class="form-control" placeholder="Poem or Letter Title">
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <textarea id="entryContent" class="form-control" placeholder="Write your words here..."></textarea>
                </div>
                <button class="submit-btn" onclick="saveEntry()">Upload Entry</button>
            </div>
        </div>

        <main id="entriesContainer">
            <!-- Dynamic entries will appear here -->
        </main>

        <footer>
            Built with all my love so you can always come back to re-read or see if i upload new letters or poems for you beautiful ❤️
        </footer>
    </div>

    <script>
        // Track whether admin session is active
        let isAdminLoggedIn = false;

        document.addEventListener('DOMContentLoaded', displayEntries);

        function toggleUploadPanel() {
            const panel = document.getElementById('uploadPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function verifyLogin() {
            const user = document.getElementById('usernameInput').value;
            const pass = document.getElementById('passwordInput').value;

            if (user === 'Sogicek' && pass === '@Qxh3zbny1') {
                isAdminLoggedIn = true;
                document.getElementById('panelHeading').innerText = 'Publish New Poem or Letter';
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('entryForm').style.display = 'block';
                displayEntries(); // Refresh view to reveal delete buttons
            } else {
                alert('Incorrect credentials.');
            }
        }

        function saveEntry() {
            const title = document.getElementById('entryTitle').value.trim();
            const content = document.getElementById('entryContent').value.trim();

            if (!title || !content) {
                alert('Please fill out both the title and content.');
                return;
            }

            const now = new Date();
            const options = { month: 'long', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            const timestamp = now.toLocaleDateString('en-US', options);

            const newEntry = {
                title: title,
                content: content,
                date: timestamp
            };

            let entries = JSON.parse(localStorage.getItem('lovestory_entries')) || [];
            entries.unshift(newEntry);
            localStorage.setItem('lovestory_entries', JSON.stringify(entries));

            document.getElementById('entryTitle').value = '';
            document.getElementById('entryContent').value = '';
            document.getElementById('uploadPanel').style.display = 'none';

            displayEntries();
        }

        function deleteEntry(index) {
            if (confirm('Are you sure you want to delete this poem or letter?')) {
                let entries = JSON.parse(localStorage.getItem('lovestory_entries')) || [];
                entries.splice(index, 1);
                localStorage.setItem('lovestory_entries', JSON.stringify(entries));
                displayEntries();
            }
        }

        function displayEntries() {
            const container = document.getElementById('entriesContainer');
            let entries = JSON.parse(localStorage.getItem('lovestory_entries')) || [];

            if (entries.length === 0) {
                entries = [{
                    title: "A Beginning",
                    content: `The first words on this page are for you.\nA quiet space to keep everything I write, just for your eyes.\n\nForever yours,\nHugo`,
                    date: "October 18, 2026, 06:00 PM"
                }];
            }

            let html = '';
            entries.forEach((entry, index) => {
                html += `
                    <article class="entry-card">
                        <div class="entry-meta">
                            <span>Poem / Letter</span>
                            <span>${entry.date}</span>
                        </div>
                        <h2 class="entry-title">${escapeHtml(entry.title)}</h2>
                        <div class="entry-content">${escapeHtml(entry.content)}</div>
                        ${isAdminLoggedIn ? `<button class="delete-btn" onclick="deleteEntry(${index})">Delete Entry</button>` : ''}
                    </article>
                `;
            });
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
